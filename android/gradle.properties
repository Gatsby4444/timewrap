# Reseau : si les telechargements Maven echouent en `bad_record_mac`, la route
# IPv4 de la machine tronque les gros transferts. Le correctif est de faire
# demarrer la JVM en preferant IPv6 -- et il doit passer par l'environnement,
# car Gradle applique les `-D` de `org.gradle.jvmargs` apres le demarrage de la
# JVM, donc trop tard pour la pile reseau :
#     JAVA_TOOL_OPTIONS=-Djava.net.preferIPv6Addresses=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
