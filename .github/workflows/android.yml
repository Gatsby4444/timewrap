name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Coeur Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: core
    env:
      KEYSTORE_B64: ${{ secrets.TIMEWRAP_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Installer cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Pointer le NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # La cle de signature vit uniquement dans les secrets du depot. Sans elle
      # (fork, pull request), Gradle retombe sur la signature debug.
      - name: Restaurer la cle de signature
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/timewrap-release.jks
          echo "TIMEWRAP_STORE_FILE=$GITHUB_WORKSPACE/android/keystore/timewrap-release.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK de release
        working-directory: android
        env:
          TIMEWRAP_STORE_PASSWORD: ${{ secrets.TIMEWRAP_STORE_PASSWORD }}
          TIMEWRAP_KEY_ALIAS: ${{ secrets.TIMEWRAP_KEY_ALIAS }}
          TIMEWRAP_KEY_PASSWORD: ${{ secrets.TIMEWRAP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/timewrap-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: timewrap-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --generate-notes --title "Timewrap $GITHUB_REF_NAME"
          fi
